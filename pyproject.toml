[project]
name = "pulseq-reports"
version = "0.1.0"
description = "Self-contained HTML review reports for Pulseq sequences"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pypulseq>=1.5.0.post1",
    "numpy",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The whole package directory, so assets/** (CSS, JavaScript, HTML) is package data.
packages = ["src/pulseq_reports"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
