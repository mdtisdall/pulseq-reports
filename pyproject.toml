[project]
name = "pulseq-reports"
version = "0.2.0rc1"
description = "Self-contained HTML review reports for Pulseq sequences"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pypulseq>=1.5.0.post1",
    "numpy",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The whole package directory, so assets/** (CSS, JavaScript, HTML) is package data.
packages = ["src/pulseq_reports"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# pypulseq upstream master (f2c582b) with two fork commits: the SAFE PNS filter as a
# recursion, and calculate_pns in chunks (branch pns-chunked of the fork). See
# docs/plans/diagram-lanes.md, section 2.6. A project that depends on pulseq-reports gets
# pypulseq from PyPI unless it adds the same source.
[tool.uv.sources]
pypulseq = { git = "https://github.com/mdtisdall/pypulseq", rev = "20b9e5e996df93d7a46ef39e3a66b555d9a85915" }

[tool.ruff]
line-length = 100
