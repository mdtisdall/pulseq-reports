[project]
name = "pulseq-reports"
version = "0.2.0rc3.dev0"
description = "Self-contained HTML review reports for Pulseq sequences"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pypulseq>=1.5.0.post1",
    "numpy",
    "scipy",
    "pulseq-checks @ git+https://github.com/mdtisdall/pulseq-checks@v0.1.0rc5",
    "pulseq-analysis @ git+https://github.com/mdtisdall/pulseq-analysis@v0.1.0rc5",
]

[project.scripts]
pulseq-report = "pulseq_reports.cli:main"

# The library's own cards, on the same interface as a plugin's cards (docs/plans/public-api.md,
# decision 14). Each entry point is the `SPEC` of a card module.
[project.entry-points."pulseq_reports.cards"]
timing = "pulseq_reports.cards.timing:SPEC"
rf-exposure = "pulseq_reports.cards.rf_exposure:SPEC"
diagram = "pulseq_reports.cards.diagram:SPEC"
rf-profile = "pulseq_reports.cards.rf_profile:SPEC"
gradient-spectrum = "pulseq_reports.cards.spectrum:SPEC"
pns = "pulseq_reports.cards.pns:SPEC"
gradient-limits = "pulseq_reports.cards.gradient_limits:SPEC"
definitions = "pulseq_reports.cards.definitions:SPEC"
blocks = "pulseq_reports.cards.blocks:SPEC"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# pulseq-checks and pulseq-analysis are direct git references (their tags), as
# pulseq-checks depends on pulseq-analysis.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# The whole package directory, so assets/** (CSS, JavaScript, HTML) is package data.
packages = ["src/pulseq_reports"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# pypulseq 1.5.0.post1 with four commits, from the fork (tag pulseq-reports-pin-1, branch
# pulseq-reports-pin): the SAFE PNS filter as a recursion, calculate_pns in chunks, the
# get_block fix for oversampled arbitrary gradients (upstream PR #424), and the read fix of
# upstream #359. TODO.md ("Move from the pypulseq fork to a pypulseq release") lists them.
# uv also applies this source for a project that depends on pulseq-reports by git URL; pip
# does not (docs/usage.md, section 1).
[tool.uv.sources]
pypulseq = { git = "https://github.com/mdtisdall/pypulseq", rev = "a74ab06e51ca09707ff54837cf5ff652f6e69e94" }

[tool.ruff]
line-length = 100
