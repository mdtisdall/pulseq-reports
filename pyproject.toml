[project]
name = "pulseq-reports"
version = "0.2.0rc1"
description = "Self-contained HTML review reports for Pulseq sequences"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pypulseq>=1.5.0.post1",
    "numpy",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The whole package directory, so assets/** (CSS, JavaScript, HTML) is package data.
packages = ["src/pulseq_reports"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# pypulseq 1.5.0.post1 with four commits, from the fork (tag pulseq-reports-pin-1, branch
# pulseq-reports-pin): the SAFE PNS filter as a recursion, calculate_pns in chunks, the
# get_block fix for oversampled arbitrary gradients (upstream PR #424), and the read fix of
# upstream #359. TODO.md ("Move from the pypulseq fork to a pypulseq release") lists them.
# uv also applies this source for a project that depends on pulseq-reports by git URL; pip
# does not (docs/usage.md, section 1).
[tool.uv.sources]
pypulseq = { git = "https://github.com/mdtisdall/pypulseq", rev = "a74ab06e51ca09707ff54837cf5ff652f6e69e94" }

[tool.ruff]
line-length = 100
