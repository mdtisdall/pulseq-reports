[project]
name = "pulseq-reports"
version = "0.1.0"
description = "Self-contained HTML review reports for Pulseq sequences"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pypulseq>=1.5.0.post1",
    "numpy",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The whole package directory, so assets/** (CSS, JavaScript, HTML) is package data.
packages = ["src/pulseq_reports"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# pypulseq 1.5.0.post1 with the SAFE PNS filter as a recursion (branch pns-lfilter of the
# fork). See docs/plans/cards-at-scale.md, section 3.6. A project that depends on
# pulseq-reports gets pypulseq from PyPI unless it adds the same source.
[tool.uv.sources]
pypulseq = { git = "https://github.com/mdtisdall/pypulseq", rev = "40f61d39c9360e40c5d9b096d185973ffb3e876d" }

[tool.ruff]
line-length = 100
